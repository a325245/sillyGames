<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santorini 3D</title>
  
  <!-- Static CSS to prevent CDN hang -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  
  <!-- Three.js and Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    #debug-panel {
      position: absolute; bottom: 10px; right: 10px; width: 350px; max-height: 250px;
      background: rgba(15, 23, 42, 0.9); color: #38bdf8; font-family: monospace;
      font-size: 11px; border-radius: 8px; display: flex; flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; z-index: 50;
      transition: max-height 0.2s ease-in-out; overflow: hidden;
    }
    #debug-panel.collapsed { max-height: 40px; }
    #debug-log { flex: 1; overflow-y: auto; padding: 8px; word-wrap: break-word; }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer" class="flex flex-col justify-between p-4">
  <!-- Top Bar -->
  <div class="flex justify-between items-start pointer-events-auto">
    <div class="bg-white p-3 rounded-lg shadow-lg">
      <h1 class="text-2xl font-extrabold text-blue-600 mb-1">SANTORINI</h1>
      <div id="status-badge" class="px-2 py-1 bg-gray-200 text-gray-800 text-xs font-bold rounded w-max mb-2">LOCAL PASS & PLAY</div>
      <div id="game-info" class="text-sm font-semibold text-gray-700">Loading...</div>
      <div id="instruction-text" class="text-xs text-gray-500 mt-1">Please wait.</div>
    </div>
    
    <button id="btn-close-menu" class="hidden bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow">
      Leave Game
    </button>
  </div>
</div>

<!-- Start / Join Menu Modal -->
<div id="modal-start-menu" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center pointer-events-auto z-40">
  <div class="bg-white p-6 rounded-xl shadow-2xl w-80 text-center">
    <h2 class="text-3xl font-black text-blue-600 mb-6">SANTORINI</h2>
    
    <div class="space-y-4">
      <button id="btn-local-play" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition">
        Local Pass & Play
      </button>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">OR ONLINE</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>
      
      <button id="btn-create-room" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">
        Create New Room
      </button>
      
      <div class="flex space-x-2">
        <input type="text" id="input-room-code" placeholder="ROOM CODE" class="w-2/3 border-2 border-gray-300 rounded-lg px-3 py-2 text-center uppercase font-bold text-lg focus:outline-none focus:border-blue-500" maxlength="6">
        <button id="btn-join-room" class="w-1/3 bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-lg transition">
          Join
        </button>
      </div>
      
      <p id="online-status" class="text-xs text-red-500 h-4 font-semibold"></p>
    </div>
  </div>
</div>

<!-- Debug Panel -->
<div id="debug-panel">
  <div class="flex justify-between items-center bg-gray-900 p-2 border-b border-gray-700 cursor-pointer select-none">
    <h3 class="text-sm font-bold text-gray-300">Debug Log</h3>
    <div class="flex space-x-2">
      <button id="btn-copy-debug" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Copy</button>
      <button id="btn-toggle-debug" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Collapse</button>
    </div>
  </div>
  <div id="debug-log"></div>
</div>

<script>
// ==========================================
// 1. FIREBASE CONFIGURATION & INIT
// ==========================================
const firebaseConfig = {
  databaseURL: "https://santorino-1a999-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const firebaseDb = firebase.database();

// ==========================================
// 2. GLOBAL STATE & VARIABLES
// ==========================================
let gameMode = 'LOCAL'; // 'LOCAL' or 'ONLINE'
let localPlayerRole = 1; // 1 (Blue) or 2 (Red)
let isHost = true;
let currentRoomRef = null;
let roomCodeDisplay = '';

// Unique ID for this browser session to strictly ignore our own Firebase echoes
const localSessionId = Math.random().toString(36).substring(2, 10);

// Game Logic State
let boardState = [];
let currentTurn = 1; 
let gamePhase = 'PLACE'; // PLACE, MOVE, BUILD, GAME_OVER
let placementCount = { 1: 0, 2: 0 };
let selectedWorkerPos = null;
let winner = 0;

// Three.js Variables
let scene, camera, renderer, controls, raycaster, mouse;
let boardGroup, highlightGroup;

// Materials
const matGrass = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
const matTile = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
const matLevel1 = new THREE.MeshLambertMaterial({ color: 0xffffff });
const matLevel2 = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 });
const matLevel3 = new THREE.MeshLambertMaterial({ color: 0xebebeb });
const matDome = new THREE.MeshLambertMaterial({ color: 0x2196F3 });
const matPlayer1 = new THREE.MeshLambertMaterial({ color: 0x1E88E5 });
const matPlayer2 = new THREE.MeshLambertMaterial({ color: 0xE53935 });
const matHighlightMove = new THREE.MeshBasicMaterial({ color: 0x00FF00, opacity: 0.4, transparent: true });
const matHighlightBuild = new THREE.MeshBasicMaterial({ color: 0x00FFFF, opacity: 0.5, transparent: true });
const matHighlightSelect = new THREE.MeshBasicMaterial({ color: 0xFFD700, opacity: 0.6, transparent: true });

// ==========================================
// 3. DEBUG LOGGING
// ==========================================
const debugLogEl = document.getElementById('debug-log');
function debugLog(...args) {
  const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = 'mb-1 border-b border-gray-800 pb-1';
  entry.innerText = `[${time}] ${msg}`;
  debugLogEl.appendChild(entry);
  debugLogEl.scrollTop = debugLogEl.scrollHeight;
  console.log(`[${time}]`, ...args);
}

document.getElementById('btn-toggle-debug').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('debug-panel');
  panel.classList.toggle('collapsed');
  e.target.innerText = panel.classList.contains('collapsed') ? 'Expand' : 'Collapse';
});

document.getElementById('btn-copy-debug').addEventListener('click', (e) => {
  e.stopPropagation();
  navigator.clipboard.writeText(debugLogEl.innerText).then(() => {
    const btn = document.getElementById('btn-copy-debug');
    btn.innerText = 'Copied!';
    setTimeout(() => btn.innerText = 'Copy', 2000);
  });
});

// ==========================================
// 4. CORE GAME LOGIC
// ==========================================
function initBoardState() {
  boardState = [];
  for (let r = 0; r < 5; r++) {
    const row = [];
    for (let c = 0; c < 5; c++) {
      row.push({ level: 0, hasDome: false, worker: 0 });
    }
    boardState.push(row);
  }
}

function serializeBoard() {
  return boardState.flat();
}

function deserializeBoard(flatArray) {
  const newBoard = [];
  for (let r = 0; r < 5; r++) {
    newBoard.push(flatArray.slice(r * 5, r * 5 + 5));
  }
  return newBoard;
}

function resetGameLogic() {
  initBoardState();
  currentTurn = 1;
  gamePhase = 'PLACE';
  placementCount = { 1: 0, 2: 0 };
  selectedWorkerPos = null;
  winner = 0;
  if (gameMode === 'ONLINE' && isHost) syncRoomState();
  render3DBoardFromState();
  updateUIStatus();
}

function syncRoomState() {
  if (gameMode !== 'ONLINE' || !currentRoomRef) return;
  
  const payload = {
    flatBoard: serializeBoard(),
    currentTurn: currentTurn,
    gamePhase: gamePhase,
    placementCount: placementCount,
    selectedWorkerPos: selectedWorkerPos || {r: -1, c: -1},
    winner: winner,
    lastWriter: localSessionId, // Used to reject our own echoes
    lastUpdated: firebase.database.ServerValue.TIMESTAMP
  };
  
  debugLog('Syncing to Firebase (Session: ' + localSessionId + ')...');
  currentRoomRef.set(payload).catch(err => debugLog("Firebase Write Error:", err));
}

// ==========================================
// 5. TURN & MOVE LOGIC
// ==========================================
function isLocalTurn() {
  if (gamePhase === 'GAME_OVER') return false;
  return gameMode === 'LOCAL' || currentTurn === localPlayerRole;
}

function getValidMoves(r, c) {
  const moves = [];
  const cell = boardState[r][c];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
        const target = boardState[nr][nc];
        if (!target.hasDome && target.worker === 0 && target.level <= cell.level + 1) {
          moves.push({ r: nr, c: nc });
        }
      }
    }
  }
  return moves;
}

function getValidBuilds(r, c) {
  const builds = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
        const target = boardState[nr][nc];
        if (!target.hasDome && target.worker === 0) {
          builds.push({ r: nr, c: nc });
        }
      }
    }
  }
  return builds;
}

function checkWinCondition(r, c) {
  if (boardState[r][c].level === 3) return true;
  
  // Check if opponent has no valid moves
  const opp = currentTurn === 1 ? 2 : 1;
  let hasMove = false;
  for(let row=0; row<5; row++){
    for(let col=0; col<5; col++){
      if(boardState[row][col].worker === opp) {
        if(getValidMoves(row, col).length > 0) hasMove = true;
      }
    }
  }
  return !hasMove;
}

function triggerWin(playerNum) {
  gamePhase = 'GAME_OVER';
  winner = playerNum;
  confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: (playerNum===1) ? ['#1E88E5','#ffffff'] : ['#E53935','#ffffff'] });
  updateUIStatus();
  if (gameMode === 'LOCAL' || isLocalTurn()) syncRoomState();
}

function processClick(r, c) {
  if (!isLocalTurn()) return;

  if (gamePhase === 'PLACE') {
    if (boardState[r][c].worker === 0) {
      boardState[r][c].worker = currentTurn;
      placementCount[currentTurn]++;
      if (placementCount[currentTurn] === 2) {
        currentTurn = currentTurn === 1 ? 2 : 1;
        if (placementCount[1] === 2 && placementCount[2] === 2) gamePhase = 'MOVE';
      }
      syncRoomState();
      render3DBoardFromState();
      updateUIStatus();
    }
  } 
  else if (gamePhase === 'MOVE') {
    if (boardState[r][c].worker === currentTurn) {
      selectedWorkerPos = { r, c };
      syncRoomState(); // Sync selection so opponent sees glow
      render3DBoardFromState();
      updateUIStatus();
    } else if (selectedWorkerPos) {
      const validMoves = getValidMoves(selectedWorkerPos.r, selectedWorkerPos.c);
      if (validMoves.some(m => m.r === r && m.c === c)) {
        // Execute Move
        boardState[r][c].worker = currentTurn;
        boardState[selectedWorkerPos.r][selectedWorkerPos.c].worker = 0;
        selectedWorkerPos = { r, c };
        
        if (checkWinCondition(r, c)) {
          triggerWin(currentTurn);
          render3DBoardFromState();
          return;
        }
        
        gamePhase = 'BUILD';
        syncRoomState();
        render3DBoardFromState();
        updateUIStatus();
      } else {
        // Clicked invalid spot, deselect
        selectedWorkerPos = null;
        syncRoomState();
        render3DBoardFromState();
        updateUIStatus();
      }
    }
  } 
  else if (gamePhase === 'BUILD') {
    if (selectedWorkerPos) {
      const validBuilds = getValidBuilds(selectedWorkerPos.r, selectedWorkerPos.c);
      if (validBuilds.some(b => b.r === r && b.c === c)) {
        if (boardState[r][c].level < 3) boardState[r][c].level++;
        else boardState[r][c].hasDome = true;
        
        selectedWorkerPos = null;
        currentTurn = currentTurn === 1 ? 2 : 1;
        gamePhase = 'MOVE';
        
        // Check if new player is trapped instantly
        if (checkWinCondition(0,0)) {
          triggerWin(currentTurn === 1 ? 2 : 1);
        } else {
          syncRoomState();
        }
        render3DBoardFromState();
        updateUIStatus();
      }
    }
  }
}

// ==========================================
// 6. THREE.JS RENDERING
// ==========================================
function init3D() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6, 8, 8);
  
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);
  
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI / 2 - 0.1;
  
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Decorative Base Octagon (lowered to prevent z-fighting with grid)
  const baseGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.4, 8);
  const baseMesh = new THREE.Mesh(baseGeo, matGrass);
  baseMesh.position.y = -0.22; 
  baseMesh.receiveShadow = true;
  scene.add(baseMesh);

  boardGroup = new THREE.Group();
  scene.add(boardGroup);
  
  highlightGroup = new THREE.Group();
  scene.add(highlightGroup);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('resize', onWindowResize);
  container.addEventListener('click', onMouseClick);
  
  animate();
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  // Raycast strictly against board pieces. 
  // Because we applied traverse(userData) during rendering, ANY piece of a building clicked returns correct (r, c).
  const intersects = raycaster.intersectObjects(boardGroup.children, true);
  
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    if (obj.userData && obj.userData.r !== undefined) {
      processClick(obj.userData.r, obj.userData.c);
    }
  }
}

// Generate the classical column structure for Level 2
function createLevel2Building() {
  const group = new THREE.Group();
  
  // Base block for Level 2
  const blockGeo = new THREE.BoxGeometry(0.75, 0.4, 0.75);
  const block = new THREE.Mesh(blockGeo, matLevel2);
  block.position.y = 0.2;
  block.castShadow = true;
  block.receiveShadow = true;
  group.add(block);
  
  // 4 Corner Columns
  const colGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.45, 8);
  const offsets = [
    [-0.3, -0.3], [0.3, -0.3], [-0.3, 0.3], [0.3, 0.3]
  ];
  offsets.forEach(pos => {
    const col = new THREE.Mesh(colGeo, matLevel2);
    col.position.set(pos[0], 0.225, pos[1]);
    col.castShadow = true;
    group.add(col);
  });
  
  return group;
}

function render3DBoardFromState() {
  // Clear old meshes
  while(boardGroup.children.length > 0){ 
    const child = boardGroup.children[0];
    boardGroup.remove(child); 
  }
  while(highlightGroup.children.length > 0){ 
    highlightGroup.remove(highlightGroup.children[0]); 
  }

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cell = boardState[r][c];
      const x = (c - 2) * 1.1;
      const z = (r - 2) * 1.1;
      let currentY = 0;
      
      // We wrap the entire stack for this grid cell in one group
      const cellStack = new THREE.Group();
      cellStack.position.set(x, 0, z);
      
      // Base Floor Tile (Raised slightly above grass to prevent z-fight)
      const tileGeo = new THREE.BoxGeometry(1, 0.1, 1);
      const tile = new THREE.Mesh(tileGeo, matTile);
      tile.position.y = 0.05;
      tile.receiveShadow = true;
      cellStack.add(tile);
      currentY = 0.1;
      
      if (cell.level >= 1) {
        const l1Geo = new THREE.BoxGeometry(0.9, 0.5, 0.9);
        const l1 = new THREE.Mesh(l1Geo, matLevel1);
        l1.position.y = currentY + 0.25;
        l1.castShadow = true; l1.receiveShadow = true;
        cellStack.add(l1);
        currentY += 0.5;
      }
      
      if (cell.level >= 2) {
        const l2Group = createLevel2Building();
        l2Group.position.y = currentY;
        cellStack.add(l2Group);
        currentY += 0.45; 
      }
      
      if (cell.level >= 3) {
        const l3Geo = new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16);
        const l3 = new THREE.Mesh(l3Geo, matLevel3);
        l3.position.y = currentY + 0.15;
        l3.castShadow = true; l3.receiveShadow = true;
        cellStack.add(l3);
        currentY += 0.3;
      }
      
      if (cell.hasDome) {
        const domeGeo = new THREE.SphereGeometry(0.3, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const dome = new THREE.Mesh(domeGeo, matDome);
        dome.position.y = currentY;
        dome.castShadow = true;
        cellStack.add(dome);
        currentY += 0.3;
      }
      
      if (cell.worker > 0) {
        const wGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.6, 16);
        const wMat = cell.worker === 1 ? matPlayer1 : matPlayer2;
        const worker = new THREE.Mesh(wGeo, wMat);
        worker.position.y = currentY + 0.3;
        worker.castShadow = true;
        cellStack.add(worker);
        
        // Turn indicator Glow ring
        if (cell.worker === currentTurn && gamePhase !== 'PLACE' && gamePhase !== 'GAME_OVER') {
          const ringGeo = new THREE.RingGeometry(0.25, 0.35, 16);
          const ring = new THREE.Mesh(ringGeo, matHighlightSelect);
          ring.rotation.x = -Math.PI / 2;
          ring.position.y = currentY + 0.02; // Just above current floor
          highlightGroup.add(ring);
          
          // Animate ring in render loop by modifying userData
          ring.userData = { isGlow: true, baseY: ring.position.y, x: x, z: z };
        }
      }
      
      // VITAL FIX: Recursively apply the grid coordinates to EVERY mesh in this cell's stack
      // This guarantees the raycaster will ALWAYS return the correct (r, c) even if a column is clicked.
      cellStack.traverse((child) => {
        if (child.isMesh) {
          child.userData = { r: r, c: c };
        }
      });
      
      boardGroup.add(cellStack);
    }
  }
  
  // Render Valid Move / Build Highlights
  if (selectedWorkerPos && isLocalTurn()) {
    let highlightCoords = [];
    let mat = null;
    
    if (gamePhase === 'MOVE') {
      highlightCoords = getValidMoves(selectedWorkerPos.r, selectedWorkerPos.c);
      mat = matHighlightMove;
    } else if (gamePhase === 'BUILD') {
      highlightCoords = getValidBuilds(selectedWorkerPos.r, selectedWorkerPos.c);
      mat = matHighlightBuild;
    }
    
    highlightCoords.forEach(pos => {
      const hx = (pos.c - 2) * 1.1;
      const hz = (pos.r - 2) * 1.1;
      
      // Calculate exact surface Y
      const tCell = boardState[pos.r][pos.c];
      let yHeight = 0.1;
      if (tCell.level >= 1) yHeight += 0.5;
      if (tCell.level >= 2) yHeight += 0.45;
      if (tCell.level >= 3) yHeight += 0.3;
      
      const planeGeo = new THREE.PlaneGeometry(0.9, 0.9);
      const plane = new THREE.Mesh(planeGeo, mat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(hx, yHeight + 0.03, hz); // +0.03 prevents z-fighting with the block below
      highlightGroup.add(plane);
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  
  // Animate turn glow rings
  const time = Date.now() * 0.005;
  highlightGroup.children.forEach(child => {
    if (child.userData.isGlow) {
      child.position.y = child.userData.baseY + Math.sin(time) * 0.05;
      child.position.x = child.userData.x;
      child.position.z = child.userData.z;
    }
  });
  
  renderer.render(scene, camera);
}

// ==========================================
// 7. UI & ONLINE ROOM MANAGEMENT
// ==========================================
function updateUIStatus() {
  const badge = document.getElementById('status-badge');
  const info = document.getElementById('game-info');
  const inst = document.getElementById('instruction-text');
  
  if (gameMode === 'LOCAL') {
    badge.innerText = 'LOCAL PASS & PLAY';
    badge.className = 'px-2 py-1 text-xs font-bold rounded w-max mb-2 bg-gray-200 text-gray-800';
  } else {
    const roleStr = isHost ? '(P1/Blue)' : '(P2/Red)';
    badge.innerText = `ONLINE: ROOM ${roomCodeDisplay} ${roleStr}`;
    badge.className = 'px-2 py-1 text-xs font-bold rounded w-max mb-2 bg-green-200 text-green-800';
  }

  if (gamePhase === 'GAME_OVER') {
    const winName = winner === 1 ? 'Player 1 (Blue)' : 'Player 2 (Red)';
    info.innerText = `🏆 ${winName} WINS! 🏆`;
    inst.innerText = 'Create or join a room to play again.';
    return;
  }

  const pName = currentTurn === 1 ? 'Player 1 (Blue)' : 'Player 2 (Red)';
  info.innerText = `Turn: ${pName}`;
  
  if (!isLocalTurn()) {
    inst.innerText = "Waiting for opponent...";
    return;
  }

  if (gamePhase === 'PLACE') {
    inst.innerText = `Place your workers (${placementCount[currentTurn]}/2 placed)`;
  } else if (gamePhase === 'MOVE') {
    inst.innerText = selectedWorkerPos ? "Click an adjacent tile to MOVE" : "Select one of your workers to move";
  } else if (gamePhase === 'BUILD') {
    inst.innerText = "Click an adjacent tile to BUILD";
  }
}

function generateRoomCode() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let result = '';
  for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
  return result;
}

function setupOnlineRoom(isCreating) {
  let roomCode = document.getElementById('input-room-code').value.trim().toUpperCase();
  
  if (isCreating) {
    roomCode = generateRoomCode();
    document.getElementById('input-room-code').value = roomCode;
  }
  
  if (!roomCode || roomCode.length < 3) {
    document.getElementById('online-status').innerText = 'Enter a valid Room Code';
    return;
  }

  roomCodeDisplay = roomCode;
  
  // Detach any previous listeners safely
  if (currentRoomRef) currentRoomRef.off();
  
  currentRoomRef = firebaseDb.ref('rooms/' + roomCode);
  gameMode = 'ONLINE';
  
  document.getElementById('modal-start-menu').classList.add('hidden');
  document.getElementById('btn-close-menu').classList.remove('hidden');

  if (isCreating) {
    localPlayerRole = 1;
    isHost = true;
    debugLog(`Created Room: ${roomCode} as HOST`);
    resetGameLogic();
  } else {
    localPlayerRole = 2;
    isHost = false;
    debugLog(`Joined Room: ${roomCode} as GUEST`);
    // Fallback UI until snapshot loads
    updateUIStatus();
  }

  currentRoomRef.on('value', snapshot => {
    const data = snapshot.val();
    if (!data) return;

    // VITAL FIX: Echo Guard. Ignore updates that originated from this exact browser session.
    // This perfectly prevents the local game from "undoing" while waiting for the server,
    // solving the multi-click latency issue permanently.
    if (data.lastWriter === localSessionId) {
      debugLog('Ignored our own Firebase echo (Session ID matched).');
      return;
    }

    debugLog('Received remote update from opponent.');

    if (data.gamePhase === 'GAME_OVER' && gamePhase !== 'GAME_OVER') {
      winner = data.winner;
      gamePhase = 'GAME_OVER';
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    } else {
      gamePhase = data.gamePhase;
      winner = data.winner || 0;
    }
    
    boardState = deserializeBoard(data.flatBoard);
    currentTurn = data.currentTurn;
    placementCount = data.placementCount || { 1: 0, 2: 0 };
    
    // Auto-reset finished games if joined late
    if (gamePhase === 'GAME_OVER' && isLocalTurn()) {
      debugLog("Joined a finished game. Resetting board...");
      resetGameLogic();
      return;
    }
    
    if (data.selectedWorkerPos && data.selectedWorkerPos.r !== -1) {
      selectedWorkerPos = data.selectedWorkerPos;
    } else {
      selectedWorkerPos = null;
    }
    
    render3DBoardFromState();
    updateUIStatus();
  });
}

// Button Listeners
document.getElementById('btn-local-play').addEventListener('click', () => {
  if (currentRoomRef) currentRoomRef.off();
  currentRoomRef = null;
  gameMode = 'LOCAL';
  document.getElementById('modal-start-menu').classList.add('hidden');
  document.getElementById('btn-close-menu').classList.remove('hidden');
  debugLog('Started Local Pass & Play');
  resetGameLogic();
});

document.getElementById('btn-create-room').addEventListener('click', () => setupOnlineRoom(true));
document.getElementById('btn-join-room').addEventListener('click', () => setupOnlineRoom(false));

document.getElementById('btn-close-menu').addEventListener('click', () => {
  if (currentRoomRef) currentRoomRef.off();
  document.getElementById('modal-start-menu').classList.remove('hidden');
  document.getElementById('btn-close-menu').classList.add('hidden');
});

// Init sequence
initBoardState();
init3D();
render3DBoardFromState();

</script>
</body>
</html>
