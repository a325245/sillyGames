<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santorini 3D - Classical Aegean Strategy</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase JS SDK (Compat Mode for RTDB) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      background-color: #0b132b;
      color: #f8fafc;
      overflow: hidden;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Glassmorphism Panel Styling */
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease-in-out;
    }

    .glass-button:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .glass-button:active {
      transform: translateY(1px);
    }

    /* Pulsing Turn Badge */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 0 24px rgba(56, 189, 248, 0.8); }
    }

    .active-turn-pulse {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    /* Custom Scrollbar for Debug Log */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between overflow-hidden">

  <!-- Top Navigation & Status Header -->
  <header class="absolute top-0 left-0 right-0 z-20 p-4 pointer-events-none flex flex-wrap items-center justify-between gap-4">
    <!-- Game Title & Room Status -->
    <div class="pointer-events-auto flex items-center gap-3 glass-panel px-4 py-2.5 rounded-2xl">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center text-white shadow-lg font-cinzel font-bold text-xl">
        S
      </div>
      <div>
        <h1 class="font-cinzel text-lg font-bold text-white tracking-wide leading-tight">SANTORINI <span class="text-xs text-blue-400 font-sans font-normal ml-1">3D</span></h1>
        <div id="status-badge" class="flex items-center gap-2 text-xs font-medium text-slate-300">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="txt-game-mode">LOCAL SOLO</span>
        </div>
      </div>
    </div>

    <!-- Active Turn & Instruction Banner -->
    <div class="pointer-events-auto glass-panel px-6 py-2.5 rounded-2xl flex items-center gap-4 border-l-4 border-blue-500 active-turn-pulse">
      <div class="text-center">
        <div id="turn-indicator" class="text-xs font-semibold uppercase tracking-wider text-blue-400">PLAYER 1'S TURN</div>
        <div id="phase-instruction" class="text-sm font-medium text-white">Place Worker 1</div>
      </div>
    </div>

    <!-- Right Controls: Menu & Debug Toggle -->
    <div class="pointer-events-auto flex items-center gap-2">
      <button id="btn-copy-code" onclick="copyRoomCode()" class="hidden glass-button px-3.5 py-2.5 rounded-xl text-xs font-semibold text-white flex items-center gap-2">
        <i class="fa-solid fa-copy text-blue-400"></i>
        <span id="txt-room-code">ROOM: ----</span>
      </button>

      <button onclick="toggleDebugLog()" class="glass-button w-10 h-10 rounded-xl text-slate-300 hover:text-white flex items-center justify-center transition-all" title="Toggle Console Log">
        <i class="fa-solid fa-terminal text-sm"></i>
      </button>

      <button onclick="openStartMenu()" class="glass-button px-4 py-2.5 rounded-xl text-xs font-semibold text-white flex items-center gap-2">
        <i class="fa-solid fa-bars text-blue-400"></i>
        <span>Lobby / Menu</span>
      </button>
    </div>
  </header>

  <!-- Main 3D Canvas Container -->
  <main id="canvas-container" class="w-full h-full absolute inset-0 z-0 bg-slate-950">
    <!-- Tile Pick Tooltip Overlay -->
    <div id="tile-tooltip" class="absolute pointer-events-none opacity-0 transition-opacity duration-150 glass-panel px-3 py-1.5 rounded-lg text-xs font-medium text-white shadow-xl z-10 border border-white/20">
      <span id="tooltip-text">Tile [0, 0]</span>
    </div>
  </main>

  <!-- Lobby / Start Menu Modal -->
  <div id="modal-start-menu" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="glass-panel w-full max-w-md p-6 rounded-3xl border border-white/15 shadow-2xl relative text-slate-100">
      <button id="btn-close-menu" onclick="closeStartMenu()" class="hidden absolute top-5 right-5 text-slate-400 hover:text-white transition-colors">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white text-3xl font-cinzel font-black shadow-lg">
          🏛️
        </div>
        <h2 class="font-cinzel text-2xl font-bold tracking-wide text-white">SANTORINI 3D</h2>
        <p class="text-xs text-slate-400 mt-1">Build, Climb, & Overcome in the Aegean</p>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="space-y-4">
        <!-- Local Pass & Play -->
        <button onclick="startLocalGame()" class="w-full p-4 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 flex items-center gap-4 transition-all hover:scale-[1.02]">
          <div class="w-11 h-11 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl">
            <i class="fa-solid fa-users"></i>
          </div>
          <div class="text-left">
            <div class="text-sm font-bold text-white">Local Pass & Play</div>
            <div class="text-xs text-slate-400">Play with two players on the same screen</div>
          </div>
        </button>

        <!-- Divider -->
        <div class="relative my-4 flex items-center justify-center">
          <div class="border-t border-white/10 w-full"></div>
          <span class="absolute bg-slate-900 px-3 text-[10px] font-bold tracking-widest text-slate-400 uppercase">ONLINE MULTIPLAYER</span>
        </div>

        <!-- Online Room Code Options -->
        <div class="space-y-3">
          <div class="flex gap-2">
            <input id="input-room-code" type="text" placeholder="ROOM CODE (e.g. OPOP)" uppercase maxlength="6"
              class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-white/20 text-white placeholder-slate-500 font-mono text-center tracking-widest uppercase focus:outline-none focus:border-blue-400 text-sm">
            <button onclick="setupOnlineRoom(false)" class="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs uppercase tracking-wider text-white transition-all shadow-lg hover:shadow-emerald-500/20 whitespace-nowrap">
              Join
            </button>
          </div>

          <button onclick="setupOnlineRoom(true)" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold text-xs uppercase tracking-wider text-white transition-all shadow-lg hover:shadow-blue-500/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i>
            Create New Online Room
          </button>
        </div>
      </div>

      <!-- Footer Info -->
      <div id="online-status" class="mt-5 text-center text-xs font-medium text-slate-400">
        Ready to play. Select mode above.
      </div>
    </div>
  </div>

  <!-- Victory Celebration Modal -->
  <div id="modal-victory" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
    <div class="glass-panel w-full max-w-sm p-8 rounded-3xl border border-yellow-500/30 text-center shadow-2xl relative overflow-hidden">
      <!-- Glow effect -->
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-yellow-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-5xl mb-3 animate-bounce">🏆</div>
      <h3 id="victory-title" class="font-cinzel text-2xl font-black text-yellow-400 tracking-wide">PLAYER 1 VICTORY!</h3>
      <p id="victory-subtitle" class="text-xs text-slate-300 mt-2">Worker ascended onto Level 3 structure!</p>

      <div class="mt-6 space-y-3">
        <button onclick="restartCurrentGame()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold text-xs uppercase tracking-wider transition-all shadow-lg shadow-yellow-500/20">
          Play Again
        </button>
        <button onclick="openStartMenu()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors">
          Return to Lobby
        </button>
      </div>
    </div>
  </div>

  <!-- Real-time Debug Log Drawer -->
  <div id="debug-drawer" class="hidden fixed bottom-4 right-4 z-40 w-96 max-w-[calc(100vw-2rem)] glass-panel rounded-2xl border border-white/20 p-4 shadow-2xl text-xs font-mono">
    <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/10">
      <div class="flex items-center gap-2 text-slate-300 font-bold">
        <i class="fa-solid fa-terminal text-blue-400"></i>
        <span>Debug Log</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearDebugLog()" class="text-slate-400 hover:text-white text-[10px] uppercase tracking-wider">Clear</button>
        <button onclick="toggleDebugLog()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div id="debug-log-content" class="h-48 overflow-y-auto space-y-1 text-slate-300 text-[11px] leading-relaxed">
      <div class="text-slate-500">[System] Debug logger initialized.</div>
    </div>
  </div>

  <script>
    /* =========================================================================
       GLOBAL GAME STATE & CONSTANTS
       ========================================================================= */
    const BOARD_SIZE = 5;
    const TILE_SIZE = 2.0;
    const TILE_GAP = 0.25;
    const STEP_SIZE = TILE_SIZE + TILE_GAP; // 2.25 spacing

    // Game logic variables
    let boardState = []; // 5x5 grid: { level: 0..3, dome: boolean, worker: 0|1|2 }
    let currentTurn = 1; // Player 1 or Player 2
    let gamePhase = 'PLACEMENT'; // 'PLACEMENT', 'MOVE', 'BUILD', 'GAME_OVER'
    let winner = 0;
    let placementCount = { 1: 0, 2: 0 }; // Track placed workers per player (2 each)
    let selectedWorkerPos = null; // { r, c }
    let gameMode = 'LOCAL'; // 'LOCAL' or 'ONLINE'
    let localPlayerRole = 0; // 0 = control both, 1 = Player 1, 2 = Player 2
    let roomCode = '';

    // Firebase synchronization
    let firebaseDb = null;
    let currentRoomRef = null;
    let lastSyncedTimestamp = 0;
    let ignoreNextRemoteSync = false;
    let hasCelebratedWin = false;

    // Three.js scene references
    let scene, camera, renderer, controls;
    let boardGroup, highlightGroup, workerGroup;
    let raycaster, mouse;
    let hoverTileMesh = null;
    let hoveredCell = null;

    // Default Firebase Config (Santorini RTDB)
    const firebaseConfig = {
      databaseURL: "https://santorino-1a999-default-rtdb.firebaseio.com"
    };

    /* =========================================================================
       DEBUG LOGGER & UTILITY FUNCTIONS
       ========================================================================= */
    function debugLog(msg, obj = null) {
      const time = new Date().toLocaleTimeString();
      console.log(`[${time}] ${msg}`, obj ? obj : '');
      
      const logContent = document.getElementById('debug-log-content');
      if (logContent) {
        const item = document.createElement('div');
        item.className = 'border-b border-white/5 pb-1';
        let detailText = obj ? `<pre class="text-[9px] text-slate-400 overflow-x-auto">${JSON.stringify(obj, null, 2)}</pre>` : '';
        item.innerHTML = `<span class="text-slate-500">[${time}]</span> <span class="text-blue-300">${msg}</span> ${detailText}`;
        logContent.appendChild(item);
        logContent.scrollTop = logContent.scrollHeight;
      }
    }

    function clearDebugLog() {
      const logContent = document.getElementById('debug-log-content');
      if (logContent) logContent.innerHTML = '';
    }

    function toggleDebugLog() {
      const drawer = document.getElementById('debug-drawer');
      drawer.classList.toggle('hidden');
    }

    function copyRoomCode() {
      if (!roomCode) return;
      navigator.clipboard.writeText(roomCode);
      const btnText = document.getElementById('txt-room-code');
      const originalText = btnText.innerText;
      btnText.innerText = 'COPIED!';
      setTimeout(() => { btnText.innerText = originalText; }, 2000);
    }

    /* =========================================================================
       FIREBASE REALTIME DATABASE INITIALIZATION
       ========================================================================= */
    function initFirebase() {
      try {
        debugLog('Initializing Firebase SDK');
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        firebaseDb = firebase.database();
        debugLog('Firebase initialized successfully.');
      } catch (err) {
        debugLog('ERROR initializing Firebase:', err);
      }
    }

    /* =========================================================================
       THREE.JS 3D SCENE SETUP & LIGHTING
       ========================================================================= */
    function init3DScene() {
      debugLog('Setting up 3D Scene...');
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b132b);
      scene.fog = new THREE.FogExp2(0x0b132b, 0.025);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 14, 16);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below island
      controls.minDistance = 8;
      controls.maxDistance = 28;
      controls.target.set(0, 1, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
      sunLight.position.set(12, 20, 10);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 0.5;
      sunLight.shadow.camera.far = 50;
      const d = 10;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.3);
      fillLight.position.set(-10, 10, -10);
      scene.add(fillLight);

      // Groups
      boardGroup = new THREE.Group();
      highlightGroup = new THREE.Group();
      workerGroup = new THREE.Group();
      scene.add(boardGroup);
      scene.add(highlightGroup);
      scene.add(workerGroup);

      // Raycaster & Mouse
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Build Coastal Island Base
      buildIslandEnvironment();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      // Animation Loop
      animate();
    }

    function buildIslandEnvironment() {
      // Aegean Sea Plane
      const seaGeo = new THREE.PlaneGeometry(200, 200);
      const seaMat = new THREE.MeshStandardMaterial({
        color: 0x005582,
        roughness: 0.1,
        metalness: 0.2
      });
      const sea = new THREE.Mesh(seaGeo, seaMat);
      sea.rotation.x = -Math.PI / 2;
      sea.position.y = -2.2;
      scene.add(sea);

      // Cliff Base Platform
      const islandGeo = new THREE.CylinderGeometry(7.5, 8.5, 2, 8);
      const islandMat = new THREE.MeshStandardMaterial({
        color: 0x3d312a,
        roughness: 0.9,
      });
      const island = new THREE.Mesh(islandGeo, islandMat);
      island.position.y = -1;
      island.receiveShadow = true;
      scene.add(island);

      // Lawn Top Platform
      const lawnGeo = new THREE.BoxGeometry(11.8, 0.4, 11.8);
      const lawnMat = new THREE.MeshStandardMaterial({
        color: 0x2e7d32,
        roughness: 0.6
      });
      const lawn = new THREE.Mesh(lawnGeo, lawnMat);
      lawn.position.y = -0.2;
      lawn.receiveShadow = true;
      scene.add(lawn);
    }

    /* =========================================================================
       3D BUILDING & ARCHITECTURAL FLOURISH MESH CREATORS
       ========================================================================= */
    // Material Palette
    const plasterMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
    const woodDoorMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.8 });
    const blueDomeMat = new THREE.MeshStandardMaterial({ color: 0x0288d1, roughness: 0.2, metalness: 0.1 });
    const goldCapMat = new THREE.MeshStandardMaterial({ color: 0xfcb316, roughness: 0.3, metalness: 0.7 });
    const columnMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.2 });

    function createLevel1Mesh() {
      const group = new THREE.Group();
      // Main plaster storey
      const body = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE, 0.9, TILE_SIZE), plasterMat);
      body.position.y = 0.45;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Recessed door flourish on side
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.05), woodDoorMat);
      door.position.set(0, 0.3, TILE_SIZE / 2 + 0.001);
      group.add(door);

      return group;
    }

    function createLevel2Mesh() {
      const group = new THREE.Group();
      
      // Central Storey Block
      const core = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.6), plasterMat);
      core.position.y = 0.45;
      core.castShadow = true;
      core.receiveShadow = true;
      group.add(core);

      // ARCHITECTURAL FLOURISH: 4 Cylindrical Corner Columns with Caps & Bases
      const colRadius = 0.1;
      const colHeight = 0.8;
      const colGeo = new THREE.CylinderGeometry(colRadius, colRadius, colHeight, 16);
      const capGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.06, 16);

      const offset = 0.82;
      const corners = [
        [-offset, -offset],
        [ offset, -offset],
        [-offset,  offset],
        [ offset,  offset]
      ];

      corners.forEach(([cx, cz]) => {
        // Base Cap
        const baseCap = new THREE.Mesh(capGeo, columnMat);
        baseCap.position.set(cx, 0.03, cz);
        group.add(baseCap);

        // Cylinder Column Shaft
        const col = new THREE.Mesh(colGeo, columnMat);
        col.position.set(cx, 0.43, cz);
        col.castShadow = true;
        group.add(col);

        // Top Capital
        const topCap = new THREE.Mesh(capGeo, columnMat);
        topCap.position.set(cx, 0.83, cz);
        group.add(topCap);
      });

      // Top Cornice / Entablature Molding
      const cornice = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE + 0.1, 0.12, TILE_SIZE + 0.1), plasterMat);
      cornice.position.y = 0.9,
      cornice.castShadow = true;
      group.add(cornice);

      return group;
    }

    function createLevel3Mesh() {
      const group = new THREE.Group();

      // Arched Pavilion Core
      const core = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 1.4), plasterMat);
      core.position.y = 0.4;
      core.castShadow = true;
      core.receiveShadow = true;
      group.add(core);

      // Balcony Rim Ledge
      const balcony = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), plasterMat);
      balcony.position.y = 0.85;
      group.add(balcony);

      return group;
    }

    function createDomeMesh() {
      const group = new THREE.Group();

      // Smooth Blue Hemisphere Dome
      const domeGeo = new THREE.SphereGeometry(0.9, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const dome = new THREE.Mesh(domeGeo, blueDomeMat);
      dome.position.y = 0;
      dome.castShadow = true;
      group.add(dome);

      // Gold Top Finial Sphere
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), goldCapMat);
      finial.position.y = 0.92;
      group.add(finial);

      return group;
    }

    function createWorkerMesh(player) {
      const group = new THREE.Group();

      const mainColor = player === 1 ? 0x1d4ed8 : 0xd97706; // Blue (P1) vs Amber/Gold (P2)
      const accentColor = player === 1 ? 0x93c5fd : 0xfef08a;

      const bodyMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.3, metalness: 0.2 });
      const accentMat = new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.2 });

      // Pedestal Base
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.15, 16), accentMat);
      base.position.y = 0.075;
      base.castShadow = true;
      group.add(base);

      // Body Torso
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 16), bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      group.add(body);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), accentMat);
      head.position.y = 0.95;
      head.castShadow = true;
      group.add(head);

      // Helmet Cap
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.05, 0.12, 16), bodyMat);
      cap.position.y = 1.15;
      group.add(cap);

      return group;
    }

    /* =========================================================================
       BOARD RENDERING & STATE SYNC TO 3D
       ========================================================================= */
    function render3DBoardFromState() {
      // Clear existing 3D board objects
      while (boardGroup.children.length > 0) boardGroup.remove(boardGroup.children[0]);
      while (workerGroup.children.length > 0) workerGroup.remove(workerGroup.children[0]);

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = boardState[r][c];
          const x = (c - 2) * STEP_SIZE;
          const z = (r - 2) * STEP_SIZE;

          // Level 0 Tile Surface
          const tileGeo = new THREE.BoxGeometry(TILE_SIZE, 0.2, TILE_SIZE);
          const tileMat = new THREE.MeshStandardMaterial({
            color: 0x81c784, // Lawn green tile top
            roughness: 0.5
          });
          const tile = new THREE.Mesh(tileGeo, tileMat);
          tile.position.set(x, 0.1, z);
          tile.receiveShadow = true;
          tile.userData = { r, c };
          boardGroup.add(tile);

          let currentY = 0.2;

          // Level 1 Building
          if (cell.level >= 1) {
            const l1 = createLevel1Mesh();
            l1.position.set(x, currentY, z);
            boardGroup.add(l1);
            currentY += 0.9;
          }

          // Level 2 Building (With Columns)
          if (cell.level >= 2) {
            const l2 = createLevel2Mesh();
            l2.position.set(x, currentY, z);
            boardGroup.add(l2);
            currentY += 0.9;
          }

          // Level 3 Building
          if (cell.level >= 3) {
            const l3 = createLevel3Mesh();
            l3.position.set(x, currentY, z);
            boardGroup.add(l3);
            currentY += 0.85;
          }

          // Dome
          if (cell.dome) {
            const dome = createDomeMesh();
            dome.position.set(x, currentY, z);
            boardGroup.add(dome);
          }

          // Worker Piece Placement
          if (cell.worker > 0) {
            const worker = createWorkerMesh(cell.worker);
            worker.position.set(x, currentY, z);
            worker.userData = { r, c, player: cell.worker };
            workerGroup.add(worker);
          }
        }
      }

      // Re-render Turn & Move Highlights
      renderHighlights();
    }

    /* =========================================================================
       DYNAMIC TURN HIGHLIGHTS & VALID MOVE OVERLAYS
       ========================================================================= */
    function renderHighlights() {
      while (highlightGroup.children.length > 0) highlightGroup.remove(highlightGroup.children[0]);

      if (gamePhase === 'GAME_OVER') return;

      const isMyTurn = (gameMode === 'LOCAL') || (localPlayerRole === currentTurn);

      // 1. Highlight Selectable Workers on Active Player's Turn
      if (isMyTurn) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = boardState[r][c];
            if (cell.worker === currentTurn) {
              const isSelected = selectedWorkerPos && selectedWorkerPos.r === r && selectedWorkerPos.c === c;
              
              // Worker Halo Ring Mesh
              const yHeight = getCellSurfaceHeight(r, c);
              const x = (c - 2) * STEP_SIZE;
              const z = (r - 2) * STEP_SIZE;

              const ringGeo = new THREE.RingGeometry(0.55, 0.75, 32);
              const ringMat = new THREE.MeshBasicMaterial({
                color: isSelected ? 0x38bdf8 : 0xfacc15,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: isSelected ? 0.95 : 0.65
              });
              const ring = new THREE.Mesh(ringGeo, ringMat);
              ring.rotation.x = -Math.PI / 2;
              ring.position.set(x, yHeight + 0.02, z);
              ring.name = "turnHalo";
              highlightGroup.add(ring);
            }
          }
        }
      }

      // 2. Highlight Valid Movement Destination Tiles
      if (gamePhase === 'MOVE' && selectedWorkerPos && isMyTurn) {
        const moves = getValidMoveTiles(selectedWorkerPos.r, selectedWorkerPos.c);
        moves.forEach(({ r, c }) => {
          createTileHighlightMesh(r, c, 0x22c55e, 0.65); // Green for Move
        });
      }

      // 3. Highlight Valid Build Destination Tiles
      if (gamePhase === 'BUILD' && selectedWorkerPos && isMyTurn) {
        const builds = getValidBuildTiles(selectedWorkerPos.r, selectedWorkerPos.c);
        builds.forEach(({ r, c }) => {
          createTileHighlightMesh(r, c, 0x06b6d4, 0.65); // Cyan/Gold for Build
        });
      }
    }

    function createTileHighlightMesh(r, c, colorHex, opacityVal) {
      const x = (c - 2) * STEP_SIZE;
      const z = (r - 2) * STEP_SIZE;
      const yHeight = getCellSurfaceHeight(r, c);

      const geo = new THREE.PlaneGeometry(TILE_SIZE * 0.92, TILE_SIZE * 0.92);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: opacityVal
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, yHeight + 0.02, z);
      highlightGroup.add(mesh);
    }

    function getCellSurfaceHeight(r, c) {
      const cell = boardState[r][c];
      let y = 0.2;
      if (cell.level >= 1) y += 0.9;
      if (cell.level >= 2) y += 0.9;
      if (cell.level >= 3) y += 0.85;
      return y;
    }

    /* =========================================================================
       SANTORINI GAME RULES & VALIDATION LOGIC
       ========================================================================= */
    function getValidMoveTiles(r, c) {
      const valid = [];
      const currentLevel = boardState[r][c].level;

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;

          if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
            const target = boardState[nr][nc];
            // Rule: Target must not have a dome, must not be occupied, and max height climb is +1
            if (!target.dome && target.worker === 0 && target.level <= currentLevel + 1) {
              valid.push({ r: nr, c: nc });
            }
          }
        }
      }
      return valid;
    }

    function getValidBuildTiles(r, c) {
      const valid = [];

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;

          if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
            const target = boardState[nr][nc];
            // Rule: Target must not have a dome and must not be occupied
            if (!target.dome && target.worker === 0) {
              valid.push({ r: nr, c: nc });
            }
          }
        }
      }
      return valid;
    }

    function checkHasLegalMoves(player) {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (boardState[r][c].worker === player) {
            if (getValidMoveTiles(r, c).length > 0) return true;
          }
        }
      }
      return false;
    }

    /* =========================================================================
       USER INTERACTION & CLICK HANDLER
       ========================================================================= */
    function handleTileClick(r, c) {
      debugLog(`Tile Clicked: [${r}, ${c}]`, { currentTurn, gamePhase, localPlayerRole, gameMode });

      // Guard: Check if it's player's turn in Online Mode
      if (gameMode === 'ONLINE' && localPlayerRole !== currentTurn) {
        debugLog('Ignored click: Not local player turn.');
        return;
      }

      if (gamePhase === 'GAME_OVER') return;

      // 1. PLACEMENT PHASE
      if (gamePhase === 'PLACEMENT') {
        if (boardState[r][c].worker === 0) {
          boardState[r][c].worker = currentTurn;
          placementCount[currentTurn]++;

          debugLog(`Placed Worker for Player ${currentTurn}. Total placed:`, placementCount);

          // Alternating placement: P1 -> P2 -> P1 -> P2
          if (placementCount[1] === 1 && placementCount[2] === 0) {
            currentTurn = 2;
          } else if (placementCount[1] === 1 && placementCount[2] === 1) {
            currentTurn = 1;
          } else if (placementCount[1] === 2 && placementCount[2] === 1) {
            currentTurn = 2;
          } else if (placementCount[1] === 2 && placementCount[2] === 2) {
            // Placement complete! Transition to main gameplay
            gamePhase = 'MOVE';
            currentTurn = 1;
            selectedWorkerPos = null;
            debugLog('Placement Phase Complete! Moving to main turn gameplay.');
          }

          onGameStateUpdated();
        }
        return;
      }

      // 2. MOVE PHASE
      if (gamePhase === 'MOVE') {
        // Selecting an owned worker
        if (boardState[r][c].worker === currentTurn) {
          selectedWorkerPos = { r, c };
          debugLog(`Selected Worker at [${r}, ${c}]`);
          onGameStateUpdated();
          return;
        }

        // Executing move to valid target
        if (selectedWorkerPos) {
          const validMoves = getValidMoveTiles(selectedWorkerPos.r, selectedWorkerPos.c);
          const isMoveValid = validMoves.some(m => m.r === r && m.c === c);

          if (isMoveValid) {
            const fromLevel = boardState[selectedWorkerPos.r][selectedWorkerPos.c].level;
            const toLevel = boardState[r][c].level;

            // Move worker
            boardState[selectedWorkerPos.r][selectedWorkerPos.c].worker = 0;
            boardState[r][c].worker = currentTurn;
            selectedWorkerPos = { r, c };

            debugLog(`Worker moved from level ${fromLevel} to level ${toLevel}.`);

            // WIN CONDITION: Worker climbs onto Level 3!
            if (toLevel === 3) {
              gamePhase = 'GAME_OVER';
              winner = currentTurn;
              debugLog(`VICTORY DETECTED! Player ${winner} reached Level 3!`);
              onGameStateUpdated();
              return;
            }

            // Transition to BUILD phase
            gamePhase = 'BUILD';
            onGameStateUpdated();
          }
        }
        return;
      }

      // 3. BUILD PHASE
      if (gamePhase === 'BUILD' && selectedWorkerPos) {
        const validBuilds = getValidBuildTiles(selectedWorkerPos.r, selectedWorkerPos.c);
        const isBuildValid = validBuilds.some(b => b.r === r && b.c === c);

        if (isBuildValid) {
          if (boardState[r][c].level < 3) {
            boardState[r][c].level++;
            debugLog(`Built Level ${boardState[r][c].level} at [${r}, ${c}]`);
          } else {
            boardState[r][c].dome = true;
            debugLog(`Built Dome at [${r}, ${c}]`);
          }

          // End Turn -> Switch to Opponent
          currentTurn = currentTurn === 1 ? 2 : 1;
          gamePhase = 'MOVE';
          selectedWorkerPos = null;

          // Check if Next Player has Legal Moves
          if (!checkHasLegalMoves(currentTurn)) {
            gamePhase = 'GAME_OVER';
            winner = currentTurn === 1 ? 2 : 1; // Opponent wins
            debugLog(`NO LEGAL MOVES for Player ${currentTurn}! Player ${winner} wins!`);
          }

          onGameStateUpdated();
        }
      }
    }

    /* =========================================================================
       STATE SYNC & FIREBASE LOGIC
       ========================================================================= */
    function onGameStateUpdated() {
      render3DBoardFromState();
      updateUIStatus();

      // Trigger Confetti Celebrations if Game Over
      if (gamePhase === 'GAME_OVER' && winner > 0 && !hasCelebratedWin) {
        triggerWinCelebration(winner);
      }

      // Sync to Firebase if Online
      if (gameMode === 'ONLINE' && currentRoomRef) {
        syncStateToFirebase();
      }
    }

    function updateUIStatus() {
      const modeText = document.getElementById('txt-game-mode');
      const turnIndicator = document.getElementById('turn-indicator');
      const instructionText = document.getElementById('phase-instruction');

      // Mode Badge
      if (gameMode === 'ONLINE') {
        const roleLabel = localPlayerRole === 1 ? 'HOST (Player 1)' : 'GUEST (Player 2)';
        modeText.innerText = `ONLINE: ${roomCode} | You are ${roleLabel}`;
      } else {
        modeText.innerText = `LOCAL PASS & PLAY`;
      }

      // Active Turn Indicator
      const isMyTurn = (gameMode === 'LOCAL') || (localPlayerRole === currentTurn);
      const turnLabel = currentTurn === 1 ? 'PLAYER 1 (Blue)' : 'PLAYER 2 (Gold)';
      turnIndicator.innerText = `${turnLabel}${isMyTurn ? ' - YOUR TURN!' : ''}`;
      turnIndicator.className = currentTurn === 1 ? 'text-xs font-semibold uppercase tracking-wider text-blue-400' : 'text-xs font-semibold uppercase tracking-wider text-amber-400';

      // Phase Instructions
      if (gamePhase === 'PLACEMENT') {
        instructionText.innerText = `Place Worker ${placementCount[currentTurn] + 1} on any empty tile`;
      } else if (gamePhase === 'MOVE') {
        instructionText.innerText = selectedWorkerPos ? 'Click adjacent green tile to MOVE' : 'Select one of your workers';
      } else if (gamePhase === 'BUILD') {
        instructionText.innerText = 'Click adjacent cyan tile to BUILD structure/dome';
      } else if (gamePhase === 'GAME_OVER') {
        instructionText.innerText = `Game Over - Player ${winner} Victory!`;
      }
    }

    function syncStateToFirebase() {
      if (!currentRoomRef) return;

      const flatBoard = {};
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          flatBoard[`${r}_${c}`] = boardState[r][c];
        }
      }

      const payload = {
        flatBoard,
        currentTurn,
        gamePhase,
        winner,
        placementCount,
        selectedWorkerPos: selectedWorkerPos || { r: -1, c: -1 },
        lastUpdated: Date.now()
      };

      lastSyncedTimestamp = payload.lastUpdated;
      ignoreNextRemoteSync = true;

      debugLog('Attempting Firebase room state WRITE...', payload);
      currentRoomRef.set(payload)
        .then(() => debugLog('Firebase WRITE Success!'))
        .catch(err => debugLog('Firebase WRITE FAILED / REJECTED', err));
    }

    function setupOnlineRoom(isCreating) {
      if (!firebaseDb) {
        document.getElementById('online-status').innerText = 'Firebase not initialized.';
        return;
      }

      let code = document.getElementById('input-room-code').value.trim().toUpperCase();
      if (!code || code.length < 3) {
        if (isCreating) {
          // Generate Random 4-letter code
          const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
          code = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
          document.getElementById('input-room-code').value = code;
        } else {
          document.getElementById('online-status').innerText = 'Enter a valid Room Code!';
          return;
        }
      }

      roomCode = code;
      currentRoomRef = firebaseDb.ref('rooms/' + roomCode);
      gameMode = 'ONLINE';

      // Show Code Copy button
      const copyBtn = document.getElementById('btn-copy-code');
      copyBtn.classList.remove('hidden');
      document.getElementById('txt-room-code').innerText = `ROOM: ${roomCode}`;

      // Close Lobby Menu
      closeStartMenu();

      if (isCreating) {
        localPlayerRole = 1;
        debugLog(`Assigned as HOST (Player 1) for room "${roomCode}"`);
        resetGameLogic();
        currentRoomRef.onDisconnect().remove();
      } else {
        localPlayerRole = 2;
        debugLog(`Assigned as GUEST (Player 2) for room "${roomCode}"`);
      }

      // Attach Listener & Instantly Inspect Room State
      debugLog(`Attaching database listener on path: "rooms/${roomCode}"`);
      currentRoomRef.on('value', snapshot => {
        debugLog(`Firebase 'value' event triggered for room "${roomCode}".`);

        if (ignoreNextRemoteSync) {
          debugLog('Echo guard active: Skipped processing self-triggered remote sync.');
          ignoreNextRemoteSync = false;
          return;
        }

        const data = snapshot.val();
        debugLog('Snapshot data received:', data);

        if (data) {
          // Instantly sync room state and render!
          deserializeFlatBoard(data.flatBoard);
          currentTurn = data.currentTurn;
          gamePhase = data.gamePhase;
          winner = data.winner || 0;
          placementCount = data.placementCount || { 1: 0, 2: 0 };
          selectedWorkerPos = (data.selectedWorkerPos && data.selectedWorkerPos.r !== -1) ? data.selectedWorkerPos : null;

          gameMode = 'ONLINE';
          onGameStateUpdated();
        } else if (!isCreating) {
          document.getElementById('online-status').innerText = `Room "${roomCode}" does not exist yet!`;
        }
      }, err => {
        debugLog('Firebase READ Error:', err);
      });
    }

    function deserializeFlatBoard(flatBoard) {
      if (!flatBoard) return;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const key = `${r}_${c}`;
          if (flatBoard[key]) {
            boardState[r][c] = { ...flatBoard[key] };
          }
        }
      }
    }

    /* =========================================================================
       VICTORY CELEBRATION & CONFETTI
       ========================================================================= */
    function triggerWinCelebration(winningPlayer) {
      hasCelebratedWin = true;
      debugLog(`Triggering Confetti Celebration for Player ${winningPlayer}`);

      // Fire confetti bursts
      if (typeof confetti === 'function') {
        const count = 200;
        const defaults = { origin: { y: 0.6 } };

        function fire(particleRatio, opts) {
          confetti(Object.assign({}, defaults, opts, {
            particleCount: Math.floor(count * particleRatio)
          }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
      }

      // Display Victory Modal
      const modal = document.getElementById('modal-victory');
      const title = document.getElementById('victory-title');
      const subtitle = document.getElementById('victory-subtitle');

      title.innerText = `PLAYER ${winningPlayer} VICTORY!`;
      title.className = winningPlayer === 1 ? 'font-cinzel text-2xl font-black text-blue-400 tracking-wide' : 'font-cinzel text-2xl font-black text-yellow-400 tracking-wide';
      subtitle.innerText = `Worker ascended onto Level 3 building structure!`;
      modal.classList.remove('hidden');
    }

    /* =========================================================================
       RAYCASTING, EVENT LISTENERS, & RESET METHODS
       ========================================================================= */
    function onPointerMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(boardGroup.children, true);

      const tooltip = document.getElementById('tile-tooltip');
      const tooltipText = document.getElementById('tooltip-text');

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.r && obj.userData.r !== 0 && obj.parent) {
          obj = obj.parent;
        }

        if (obj && obj.userData.r !== undefined) {
          const { r, c } = obj.userData;
          hoveredCell = { r, c };
          const cell = boardState[r][c];

          tooltipText.innerText = `Tile [${r}, ${c}] | Level ${cell.level}${cell.dome ? ' (Dome)' : ''}`;
          tooltip.style.left = `${event.clientX + 12}px`;
          tooltip.style.top = `${event.clientY + 12}px`;
          tooltip.classList.remove('opacity-0');
          return;
        }
      }

      hoveredCell = null;
      tooltip.classList.add('opacity-0');
    }

    function onPointerDown(event) {
      if (event.button !== 0) return; // Main click only
      if (hoveredCell) {
        handleTileClick(hoveredCell.r, hoveredCell.c);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function resetGameLogic() {
      debugLog('Resetting game logic...');
      boardState = Array(BOARD_SIZE).fill(null).map(() =>
        Array(BOARD_SIZE).fill(null).map(() => ({ level: 0, dome: false, worker: 0 }))
      );
      currentTurn = 1;
      gamePhase = 'PLACEMENT';
      winner = 0;
      placementCount = { 1: 0, 2: 0 };
      selectedWorkerPos = null;
      hasCelebratedWin = false;

      document.getElementById('modal-victory').classList.add('hidden');
      onGameStateUpdated();
    }

    function restartCurrentGame() {
      resetGameLogic();
    }

    function startLocalGame() {
      gameMode = 'LOCAL';
      localPlayerRole = 0;
      document.getElementById('btn-copy-code').classList.add('hidden');
      closeStartMenu();
      resetGameLogic();
    }

    function openStartMenu() {
      document.getElementById('modal-start-menu').classList.remove('hidden');
      document.getElementById('btn-close-menu').classList.remove('hidden');
    }

    function closeStartMenu() {
      document.getElementById('modal-start-menu').classList.add('hidden');
    }

    /* =========================================================================
       ANIMATION LOOP
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      // Pulse turn halo rings
      const time = clock ? clock.getElapsedTime() : Date.now() * 0.003;
      highlightGroup.children.forEach(child => {
        if (child.name === 'turnHalo') {
          const scale = 1 + Math.sin(time * 5) * 0.08;
          child.scale.set(scale, scale, 1);
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    const clock = new THREE.Clock();

    // App Initialization on Window Load
    window.onload = function () {
      debugLog('App Initializing...');
      initFirebase();
      init3DScene();
      resetGameLogic();
    };
  </script>
</body>
