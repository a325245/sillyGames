<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Santorini 3D</title>

		<!-- Static CSS to prevent CDN hang -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

		  <!-- Three.js and Dependencies -->
		  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

		  <!-- Firebase -->
		  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
		  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

		  <!-- Confetti -->
		  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

		  <style>
			body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
			#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
			.pointer-events-auto { pointer-events: auto; }
			#canvas-container { width: 100vw; height: 100vh; display: block; }

			#debug-panel {
			position: absolute; bottom: 10px; right: 10px; width: 350px; max-height: 250px;
			background: rgba(15, 23, 42, 0.9); color: #38bdf8; font-family: monospace;
			font-size: 11px; border-radius: 8px; display: flex; flex-direction: column;
			box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; z-index: 50;
			transition: max-height 0.2s ease-in-out; overflow: hidden;
			}
			#debug-panel.collapsed { max-height: 40px; }
			#debug-log { flex: 1; overflow-y: auto; padding: 8px; word-wrap: break-word; }

			/* Mobile Optimizations */
			@media (max-width: 768px) {
			  #ui-layer { padding: 8px; }
			  #canvas-container { width: 100vw; height: 100vh; }

			  /* Make modals mobile-friendly */
			  #modal-start-menu .bg-white {
				width: 90vw;
				max-width: 400px;
				max-height: 90vh;
				overflow-y: auto;
				padding: 16px;
			  }

			  /* Adjust input sizes for touch */
			  input[type="text"] {
				font-size: 16px;
				padding: 12px 8px;
			  }

			  button {
				font-size: 14px;
				padding: 12px 8px;
				min-height: 44px;
			  }

			  /* Make debug panel mobile-friendly */
			  #debug-panel {
				width: 90vw;
				max-width: 350px;
				font-size: 10px;
				bottom: 5px;
				right: 5px;
			  }

			  #debug-panel.collapsed { max-height: 35px; }

			  /* Scale down game info for small screens */
			  .bg-white h1 {
				font-size: 20px;
			  }

			  .bg-white > div {
				font-size: 12px;
			  }
			}

			/* Extra small phones */
			@media (max-width: 480px) {
			  #ui-layer { padding: 4px; }

			  #modal-start-menu .bg-white {
				width: 95vw;
				padding: 12px;
			  }

			  .bg-white h1 {
				font-size: 18px;
				margin-bottom: 4px;
			  }

			  input[type="text"], button {
				font-size: 13px;
				padding: 10px 6px;
			  }

			  #debug-panel {
				width: 95vw;
				font-size: 9px;
			  }
			}

			/* Landscape mode on mobile */
			@media (max-height: 500px) {
			  #modal-start-menu .bg-white {
				max-height: 85vh;
				overflow-y: auto;
			  }

			  #debug-panel {
				max-height: 200px;
			  }
			}
		  </style>
		</head>
  <body>

	<div id="canvas-container"></div>

	<div id="ui-layer" class="flex flex-col justify-between p-4">
	  <div class="flex justify-between items-start pointer-events-auto">
		<div class="bg-white p-3 rounded-lg shadow-lg">
		  <h1 class="text-2xl font-extrabold text-blue-600 mb-1">SANTORINI</h1>
		  <div id="status-badge" class="px-2 py-1 bg-gray-200 text-gray-800 text-xs font-bold rounded w-max mb-2">LOCAL PASS & PLAY</div>
		  <div id="game-info" class="text-sm font-semibold text-gray-700">Loading...</div>
		  <div id="instruction-text" class="text-xs text-gray-500 mt-1">Please wait.</div>
		</div>

		<button id="btn-close-menu" class="hidden bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow">
		  Leave Game
		</button>
	  </div>
	</div>

	<!-- Start / Join Menu Modal -->
	<div id="modal-start-menu" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center pointer-events-auto z-40">
	  <div class="bg-white p-6 rounded-xl shadow-2xl w-80 text-center">
		<h2 class="text-3xl font-black text-blue-600 mb-6">SANTORINI</h2>

		<div class="space-y-4">
		  <input type="text" id="input-player-name" placeholder="YOUR NAME" class="w-full border-2 border-gray-300 rounded-lg px-3 py-2 text-center font-bold text-lg focus:outline-none focus:border-blue-500">

			<button id="btn-local-play" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition">
			  Local Pass & Play
			</button>

			<div class="relative flex py-2 items-center">
			  <div class="flex-grow border-t border-gray-300"></div>
			  <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">OR ONLINE</span>
			  <div class="flex-grow border-t border-gray-300"></div>
			</div>

			<button id="btn-create-room" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">
			  Create New Room
			</button>

			<div class="flex space-x-2">
			  <input type="text" id="input-room-code" placeholder="ROOM CODE" class="w-2/3 border-2 border-gray-300 rounded-lg px-3 py-2 text-center uppercase font-bold text-lg focus:outline-none focus:border-blue-500" maxlength="6">
				<button id="btn-join-room" class="w-1/3 bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-lg transition">
				  Join
				</button>
			  </div>

			<p id="online-status" class="text-xs text-red-500 h-4 font-semibold"></p>
		  </div>
	  </div>
	</div>

	<!-- Debug Panel -->
	<div id="debug-panel" class="collapsed">
	  <div class="flex justify-between items-center bg-gray-900 p-2 border-b border-gray-700 cursor-pointer select-none">
		<h3 class="text-sm font-bold text-gray-300">Debug Log</h3>
		<div class="flex space-x-2">
		  <button id="btn-copy-debug" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Copy</button>
		  <button id="btn-toggle-debug" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Expand</button>
		</div>
	  </div>
	  <div id="debug-log"></div>
	</div>

	<script>
	  // ==========================================
	  // 0. STARTUP DIAGNOSTICS
	  // ==========================================
	  console.log('Santorini script loaded');
	  window.addEventListener('error', function(ev) {
		try {
		  const msg = `[RUNTIME ERROR] ${ev.error && ev.error.message ? ev.error.message : ev.message} @ line ${ev.lineno}`;
		  console.error(msg, ev);
		  const dbg = document.getElementById('debug-log');
		  if (dbg) {
			const entry = document.createElement('div');
			entry.className = 'mb-1 border-b border-gray-800 pb-1 text-red-400';
			entry.innerText = msg;
			dbg.appendChild(entry);
		  }
		} catch (e) { console.error('Error recording runtime error', e); }
	  });

	  // ==========================================
	  // 1. FIREBASE CONFIGURATION & INIT
	  // ==========================================
	  console.log('Initializing Firebase');
	  const firebaseConfig = {
		databaseURL: "https://santorino-1a999-default-rtdb.firebaseio.com"
	  };
	  let firebaseDb;
	  try {
		firebase.initializeApp(firebaseConfig);
		firebaseDb = firebase.database();
		console.log('Firebase initialized');
	  } catch (e) {
		console.error('Firebase init error:', e);
	  }

	  // ==========================================
	  // 2. GLOBAL STATE & VARIABLES
	  // ==========================================
	  let gameMode = 'LOCAL';
	  let localPlayerRole = 1;
	  let isHost = true;
	  let localPlayerName = '';
	  let currentRoomRef = null;
	  let roomCodeDisplay = '';

	  const localSessionId = Math.random().toString(36).substring(2, 10);

	  let boardState = [];
	  let currentTurn = 1;
	  let gamePhase = 'PLACE';
	  let placementCount = { 1: 0, 2: 0 };
	  let selectedWorkerPos = null;
	  let winner = 0;

	  // ==========================================
	  // 2.5 COOKIE MANAGEMENT
	  // ==========================================
	  function setCookie(name, value, days = 30) {
		const date = new Date();
		date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
		const expires = 'expires=' + date.toUTCString();
		document.cookie = name + '=' + encodeURIComponent(value) + ';' + expires + ';path=/';
		debugLog('Cookie set: ' + name + ' = ' + value);
	  }

	  function getCookie(name) {
		const nameEQ = name + '=';
		const cookies = document.cookie.split(';');
		for (let i = 0; i < cookies.length; i++) {
		  let c = cookies[i].trim();
		  if (c.indexOf(nameEQ) === 0) {
			return decodeURIComponent(c.substring(nameEQ.length));
		  }
		}
		return null;
	  }

	  function loadFromCookies() {
		const savedName = getCookie('santorini_playerName');
		const savedRoom = getCookie('santorini_roomCode');
		if (savedName) {
		  document.getElementById('input-player-name').value = savedName;
		  debugLog('Loaded player name from cookie: ' + savedName);
		}
		if (savedRoom) {
		  document.getElementById('input-room-code').value = savedRoom;
		  debugLog('Loaded room code from cookie: ' + savedRoom);
		}
	  }

	  let scene, camera, renderer, controls, raycaster, mouse;
	  let boardGroup, highlightGroup;

	  // Mobile touch tracking
	  let lastTouchPos = null;
	  let touchStartTime = 0;
	  const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

	  const matGrass = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
	  const matTile = new THREE.MeshLambertMaterial({ color: 0xc4c4c4 });
	  const matLevel1 = new THREE.MeshLambertMaterial({ color: 0xffffff });
	  const matLevel2 = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 });
	  const matLevel3 = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
	  const matDome = new THREE.MeshLambertMaterial({ color: 0x0ea5e9 });
	  const matPlayer1 = new THREE.MeshLambertMaterial({ color: 0x2563eb });
	  const matPlayer2 = new THREE.MeshLambertMaterial({ color: 0xdc2626 });
	  const matHighlightMove = new THREE.MeshBasicMaterial({ color: 0x22c55e, opacity: 0.5, transparent: true });
	  const matHighlightBuild = new THREE.MeshBasicMaterial({ color: 0xeab308, opacity: 0.45, transparent: true });
	  const matHighlightSelect = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, opacity: 0.6, transparent: true });

	  // ==========================================
	  // 3. DEBUG LOGGING
	  // ==========================================
	  const debugLogEl = document.getElementById('debug-log');
	  function debugLog(...args) {
		const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
		const time = new Date().toLocaleTimeString();
		const entry = document.createElement('div');
		entry.className = 'mb-1 border-b border-gray-800 pb-1';
		entry.innerText = `[${time}] ${msg}`;
		debugLogEl.appendChild(entry);
		debugLogEl.scrollTop = debugLogEl.scrollHeight;
		console.log(`[${time}]`, ...args);
	  }

	  document.getElementById('btn-toggle-debug').addEventListener('click', (e) => {
		e.stopPropagation();
		const panel = document.getElementById('debug-panel');
		panel.classList.toggle('collapsed');
		e.target.innerText = panel.classList.contains('collapsed') ? 'Expand' : 'Collapse';
	  });

	  document.getElementById('btn-copy-debug').addEventListener('click', (e) => {
		e.stopPropagation();
		navigator.clipboard.writeText(debugLogEl.innerText).then(() => {
		  const btn = document.getElementById('btn-copy-debug');
		  btn.innerText = 'Copied!';
		  setTimeout(() => btn.innerText = 'Copy', 2000);
		});
	  });

	  debugLog('App initialized. Ready for game setup.');

	  // ==========================================
	  // 4. CORE GAME LOGIC
	  // ==========================================
	  function initBoardState() {
		boardState = [];
		for (let r = 0; r < 5; r++) {
		  const row = [];
		  for (let c = 0; c < 5; c++) {
			row.push({ level: 0, hasDome: false, worker: 0 });
		  }
		  boardState.push(row);
		}
	  }

	  function serializeBoard() { return boardState.flat(); }
	  function deserializeBoard(flatArray) {
		const newBoard = [];
		for (let r = 0; r < 5; r++) newBoard.push(flatArray.slice(r * 5, r * 5 + 5));
		return newBoard;
	  }

	  function resetGameLogic() {
		initBoardState();
		currentTurn = 1;
		gamePhase = 'PLACE';
		placementCount = { 1: 0, 2: 0 };
		selectedWorkerPos = null;
		winner = 0;
		if (gameMode === 'ONLINE' && isHost) syncRoomState();
		render3DBoardFromState();
		updateUIStatus();
	  }

	  function syncRoomState() {
		if (gameMode !== 'ONLINE' || !currentRoomRef) return;

		const payload = {
		  flatBoard: serializeBoard(),
		  currentTurn: currentTurn,
		  gamePhase: gamePhase,
		  placementCount: placementCount,
		  selectedWorkerPos: selectedWorkerPos || {r: -1, c: -1},
		  winner: winner,
		  lastWriter: localSessionId,
		  lastUpdated: firebase.database.ServerValue.TIMESTAMP
		};

		debugLog('Syncing to Firebase: phase=' + gamePhase + ', turn=' + currentTurn + ', winner=' + winner);
		currentRoomRef.update(payload).catch(err => debugLog('Firebase Write Error:', err));
	  }

	  // ==========================================
	  // 5. TURN & MOVE LOGIC
	  // ==========================================
	  function isLocalTurn() {
		if (gamePhase === 'GAME_OVER') return false;
		return gameMode === 'LOCAL' || currentTurn === localPlayerRole;
	  }

	  function getValidMoves(r, c) {
		const moves = [];
		const cell = boardState[r][c];
		for (let dr = -1; dr <= 1; dr++) {
		  for (let dc = -1; dc <= 1; dc++) {
			if (dr === 0 && dc === 0) continue;
			const nr = r + dr, nc = c + dc;
			if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
			  const target = boardState[nr][nc];
			  if (!target.hasDome && target.worker === 0 && target.level <= cell.level + 1) moves.push({ r: nr, c: nc });
			}
		  }
		}
		return moves;
	  }

	  function getValidBuilds(r, c) {
		const builds = [];
		for (let dr = -1; dr <= 1; dr++) {
		  for (let dc = -1; dc <= 1; dc++) {
			if (dr === 0 && dc === 0) continue;
			const nr = r + dr, nc = c + dc;
			if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
			  const target = boardState[nr][nc];
			  if (!target.hasDome && target.worker === 0) builds.push({ r: nr, c: nc });
			}
		  }
		}
		return builds;
	  }

	  function checkWinCondition(r, c) {
		if (typeof r === 'number' && typeof c === 'number' && r >= 0 && r < 5 && c >= 0 && c < 5) {
		  return boardState[r][c].level === 3;
		}
		return false;
	  }

	  function hasAvailableMoves(playerNum) {
		for (let row = 0; row < 5; row++) {
		  for (let col = 0; col < 5; col++) {
			if (boardState[row][col].worker === playerNum) {
			  if (getValidMoves(row, col).length > 0) return true;
			}
		  }
		}
		return false;
	  }

	  function triggerWin(playerNum) {
		gamePhase = 'GAME_OVER';
		winner = playerNum;
		confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: (playerNum===1) ? ['#2563eb','#ffffff'] : ['#dc2626','#ffffff'] });
		updateUIStatus();
		if (gameMode === 'LOCAL' || isLocalTurn()) syncRoomState();
	  }

	  function processClick(r, c) {
		if (!isLocalTurn()) return;

		if (gamePhase === 'PLACE') {
		  if (boardState[r][c].worker === 0) {
			boardState[r][c].worker = currentTurn;
			placementCount[currentTurn]++;

			const totalPlaced = placementCount[1] + placementCount[2];
			if (totalPlaced === 4) {
			  gamePhase = 'MOVE';
			  currentTurn = 1;
			} else {
			  currentTurn = currentTurn === 1 ? 2 : 1;
			}

			syncRoomState();
			render3DBoardFromState();
			updateUIStatus();
		  }
		}
		else if (gamePhase === 'MOVE') {
		  if (boardState[r][c].worker === currentTurn) {
			selectedWorkerPos = { r, c };
			syncRoomState();
			render3DBoardFromState();
			updateUIStatus();
		  } else if (selectedWorkerPos) {
			const validMoves = getValidMoves(selectedWorkerPos.r, selectedWorkerPos.c);
			if (validMoves.some(m => m.r === r && m.c === c)) {
			  boardState[r][c].worker = currentTurn;
			  boardState[selectedWorkerPos.r][selectedWorkerPos.c].worker = 0;
			  selectedWorkerPos = { r, c };

			  if (checkWinCondition(r, c)) {
				triggerWin(currentTurn);
				render3DBoardFromState();
				return;
			  }

			  gamePhase = 'BUILD';
			  syncRoomState();
			  render3DBoardFromState();
			  updateUIStatus();
			} else {
			  selectedWorkerPos = null;
			  syncRoomState();
			  render3DBoardFromState();
			  updateUIStatus();
			}
		  }
		}
		else if (gamePhase === 'BUILD') {
		  if (selectedWorkerPos) {
			const validBuilds = getValidBuilds(selectedWorkerPos.r, selectedWorkerPos.c);
			if (validBuilds.some(b => b.r === r && b.c === c)) {
			  if (boardState[r][c].level < 3) boardState[r][c].level++;
			  else boardState[r][c].hasDome = true;

			  const prevPlayer = currentTurn;
			  selectedWorkerPos = null;
			  currentTurn = currentTurn === 1 ? 2 : 1;
			  gamePhase = 'MOVE';

			  if (!hasAvailableMoves(currentTurn)) {
				triggerWin(prevPlayer);
			  } else {
				syncRoomState();
			  }

			  render3DBoardFromState();
			  updateUIStatus();
			}
		  }
		}
	  }

	  // ==========================================
	  // 6. THREE.JS RENDERING & VISUALS
	  // ==========================================
	  function init3D() {
		const container = document.getElementById('canvas-container');
		scene = new THREE.Scene();

		camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
		camera.position.set(6, 8, 8);

		renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.shadowMap.enabled = true;
		container.appendChild(renderer.domElement);

		controls = new THREE.OrbitControls(camera, renderer.domElement);
		controls.enablePan = false;
		controls.maxPolarAngle = Math.PI / 2 - 0.1;

		const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
		scene.add(ambientLight);

		const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
		dirLight.position.set(5, 10, 5);
		dirLight.castShadow = true;
		scene.add(dirLight);

		const baseGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.4, 8);
		const baseMesh = new THREE.Mesh(baseGeo, matGrass);
		baseMesh.position.y = -0.22; 
		baseMesh.receiveShadow = true;
		scene.add(baseMesh);

		boardGroup = new THREE.Group();
		scene.add(boardGroup);

		highlightGroup = new THREE.Group();
		scene.add(highlightGroup);

		raycaster = new THREE.Raycaster();
		mouse = new THREE.Vector2();

		window.addEventListener('resize', onWindowResize);
		container.addEventListener('click', onMouseClick);
		container.addEventListener('touchstart', onTouchStart);
		container.addEventListener('touchend', onTouchEnd);

		animate();
	  }

	  function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize(window.innerWidth, window.innerHeight);
	  }

	  function onMouseClick(event) {
		mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
		mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

		raycaster.setFromCamera(mouse, camera);
		const intersects = raycaster.intersectObjects(boardGroup.children, true);

		if (intersects.length > 0) {
		  const obj = intersects[0].object;
		  if (obj.userData && obj.userData.r !== undefined) {
			const clickPos = { r: obj.userData.r, c: obj.userData.c };

			// On mobile, require two-stage confirmation to prevent accidental taps
			if (isMobileDevice()) {
			  if (lastTouchPos && lastTouchPos.r === clickPos.r && lastTouchPos.c === clickPos.c) {
				// Second tap on same tile - confirm action
				debugLog('Mobile: Two-tap confirmed on tile (' + clickPos.r + ', ' + clickPos.c + ')');
				processClick(clickPos.r, clickPos.c);
				lastTouchPos = null;
			  } else {
				// First tap - highlight selection
				lastTouchPos = clickPos;
				debugLog('Mobile: First tap on tile (' + clickPos.r + ', ' + clickPos.c + ') - tap again to confirm');
			  }
			} else {
			  // Desktop - single click
			  processClick(clickPos.r, clickPos.c);
			}
		  }
		}
	  }

	  function onTouchStart(event) {
		touchStartTime = Date.now();
	  }

	  function onTouchEnd(event) {
		// Prevent accidental long-touch drags from triggering actions
		const touchDuration = Date.now() - touchStartTime;
		if (touchDuration > 500) {
		  debugLog('Touch held for ' + touchDuration + 'ms - ignoring');
		  return;
		}

		// Use the last touch position to raycasting
		if (event.changedTouches && event.changedTouches.length > 0) {
		  const touch = event.changedTouches[0];
		  mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
		  mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

		  raycaster.setFromCamera(mouse, camera);
		  const intersects = raycaster.intersectObjects(boardGroup.children, true);

		  if (intersects.length > 0) {
			const obj = intersects[0].object;
			if (obj.userData && obj.userData.r !== undefined) {
			  const clickPos = { r: obj.userData.r, c: obj.userData.c };

			  if (lastTouchPos && lastTouchPos.r === clickPos.r && lastTouchPos.c === clickPos.c) {
				// Second tap on same tile - confirm action
				debugLog('Mobile: Two-tap confirmed on tile (' + clickPos.r + ', ' + clickPos.c + ')');
				processClick(clickPos.r, clickPos.c);
				lastTouchPos = null;
			  } else {
				// First tap - highlight selection
				lastTouchPos = clickPos;
				debugLog('Mobile: First tap on tile (' + clickPos.r + ', ' + clickPos.c + ') - tap again to confirm');
			  }
			}
		  }
		}
	  }

	  function createLevel2Building() {
		const group = new THREE.Group();
		const floorGeo = new THREE.BoxGeometry(0.75, 0.1, 0.75);
		const floor = new THREE.Mesh(floorGeo, matLevel2);
		floor.position.y = 0.05;
		floor.castShadow = true; floor.receiveShadow = true;
		group.add(floor);

		const colGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.25, 8);
		const offsets = [[-0.28, -0.28], [0.28, -0.28], [-0.28, 0.28], [0.28, 0.28]];
		offsets.forEach(pos => {
		  const col = new THREE.Mesh(colGeo, matLevel2);
		  col.position.set(pos[0], 0.225, pos[1]);
		  col.castShadow = true;
		  group.add(col);
		});

		const roofGeo = new THREE.BoxGeometry(0.75, 0.1, 0.75);
		const roof = new THREE.Mesh(roofGeo, matLevel2);
		roof.position.y = 0.4;
		roof.castShadow = true; roof.receiveShadow = true;
		group.add(roof);

		return group;
	  }

	  function createWorker(playerNum) {
		const group = new THREE.Group();
		const wMat = playerNum === 1 ? matPlayer1 : matPlayer2;

		const bodyGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.4, 16);
		const body = new THREE.Mesh(bodyGeo, wMat);
		body.position.y = 0.2;
		body.castShadow = true;

		const headGeo = new THREE.SphereGeometry(0.14, 16, 16);
		const head = new THREE.Mesh(headGeo, wMat);
		head.position.y = 0.48;
		head.castShadow = true;

		group.add(body);
		group.add(head);
		return group;
	  }

	  function render3DBoardFromState() {
		while(boardGroup.children.length > 0) boardGroup.remove(boardGroup.children[0]);
		while(highlightGroup.children.length > 0) highlightGroup.remove(highlightGroup.children[0]);

		for (let r = 0; r < 5; r++) {
		  for (let c = 0; c < 5; c++) {
			const cell = boardState[r][c];
			const x = (c - 2) * 1.1;
			const z = (r - 2) * 1.1;
			let currentY = 0;

			const cellStack = new THREE.Group();
			cellStack.position.set(x, 0, z);

			const tile = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 1), matTile);
			tile.position.y = 0.05;
			tile.receiveShadow = true;
			cellStack.add(tile);
			currentY = 0.1;

			if (cell.level >= 1) {
			  const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.9), matLevel1);
			  l1.position.y = currentY + 0.2;
			  l1.castShadow = true; l1.receiveShadow = true;
			  cellStack.add(l1);
			  currentY += 0.4;
			}

			if (cell.level >= 2) {
			  const l2Group = createLevel2Building();
			  l2Group.position.y = currentY;
			  cellStack.add(l2Group);
			  currentY += 0.45; 
			}

			if (cell.level >= 3) {
			  const l3 = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16), matLevel3);
			  l3.position.y = currentY + 0.15;
			  l3.castShadow = true; l3.receiveShadow = true;
			  cellStack.add(l3);
			  currentY += 0.3;
			}

			if (cell.hasDome) {
			  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), matDome);
			  dome.position.y = currentY;
			  dome.castShadow = true;
			  cellStack.add(dome);
			  currentY += 0.35;
			}

			if (cell.worker > 0) {
			  const worker = createWorker(cell.worker);
			  worker.position.y = currentY;
			  cellStack.add(worker);

			  if (cell.worker === currentTurn && gamePhase !== 'PLACE' && gamePhase !== 'GAME_OVER') {
				const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.4, 16), matHighlightSelect);
				ring.rotation.x = -Math.PI / 2;
				ring.position.y = currentY + 0.02;
				highlightGroup.add(ring);
				ring.userData = { isGlow: true, baseY: ring.position.y, x: x, z: z };
			  }
			}

			cellStack.traverse((child) => {
			  if (child.isMesh) child.userData = { r: r, c: c };
			});
			boardGroup.add(cellStack);
		  }
		}

		if (selectedWorkerPos && isLocalTurn()) {
		  let highlightCoords = [];
		  let mat = null;

		  if (gamePhase === 'MOVE') { highlightCoords = getValidMoves(selectedWorkerPos.r, selectedWorkerPos.c); mat = matHighlightMove; }
		  else if (gamePhase === 'BUILD') { highlightCoords = getValidBuilds(selectedWorkerPos.r, selectedWorkerPos.c); mat = matHighlightBuild; }

		  highlightCoords.forEach(pos => {
			const hx = (pos.c - 2) * 1.1;
			const hz = (pos.r - 2) * 1.1;

			const tCell = boardState[pos.r][pos.c];
			let yHeight = 0.1;
			if (tCell.level >= 1) yHeight += 0.4;
			if (tCell.level >= 2) yHeight += 0.45;
			if (tCell.level >= 3) yHeight += 0.3;

			const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), mat);
			plane.rotation.x = -Math.PI / 2;
			plane.position.set(hx, yHeight + 0.03, hz);
			highlightGroup.add(plane);
		  });
		}
	  }

	  function animate() {
		requestAnimationFrame(animate);
		controls.update();
		const time = Date.now() * 0.005;
		highlightGroup.children.forEach(child => {
		  if (child.userData.isGlow) {
			child.position.y = child.userData.baseY + Math.sin(time) * 0.05;
			child.position.x = child.userData.x;
			child.position.z = child.userData.z;
		  }
		});
		renderer.render(scene, camera);
	  }

	  // ==========================================
	  // 7. UI & ONLINE ROOM MANAGEMENT
	  // ==========================================
	  function updateUIStatus() {
		const badge = document.getElementById('status-badge');
		const info = document.getElementById('game-info');
		const inst = document.getElementById('instruction-text');

		if (gameMode === 'LOCAL') {
		  badge.innerText = 'LOCAL PASS & PLAY';
		  badge.className = 'px-2 py-1 text-xs font-bold rounded w-max mb-2 bg-gray-200 text-gray-800';
		} else {
		  const roleStr = isHost ? '(P1/Blue)' : '(P2/Red)';
		  badge.innerText = `ONLINE: ROOM ${roomCodeDisplay} | YOU: ${localPlayerName.toUpperCase()} ${roleStr}`;
		  badge.className = 'px-2 py-1 text-xs font-bold rounded w-max mb-2 bg-green-200 text-green-800';
		}

		if (gamePhase === 'GAME_OVER') {
		  const winName = winner === 1 ? 'Player 1 (Blue)' : 'Player 2 (Red)';
		  info.innerText = `🏆 ${winName} WINS! 🏆`;
		  inst.innerText = 'Create or join a room to play again.';
		  return;
		}

		const pName = currentTurn === 1 ? 'Player 1 (Blue)' : 'Player 2 (Red)';
		info.innerText = `Turn: ${pName}`;

		if (!isLocalTurn()) {
		  inst.innerText = "Waiting for opponent...";
		  return;
		}

		if (gamePhase === 'PLACE') {
		  inst.innerText = `Place your workers (${placementCount[currentTurn]}/2 placed)`;
		} else if (gamePhase === 'MOVE') {
		  inst.innerText = selectedWorkerPos ? "Click an adjacent tile to MOVE" : "Select one of your workers to move";
		} else if (gamePhase === 'BUILD') {
		  inst.innerText = "Click an adjacent tile to BUILD";
		}
	  }

	  function generateRoomCode() {
		const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
		let result = '';
		for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
		return result;
	  }

	  async function setupOnlineRoom(isCreating) {
		try {
		  const nameInput = document.getElementById('input-player-name').value.trim();
		  const errorText = document.getElementById('online-status');

		  debugLog('setupOnlineRoom() called. isCreating=' + isCreating);
		  errorText.innerText = '';

		  if (!nameInput) {
			errorText.innerText = 'Please enter a Name first.';
			debugLog('No name entered');
			return;
		  }

		  localPlayerName = nameInput;
		  let roomCode = document.getElementById('input-room-code').value.trim().toUpperCase();

		  if (isCreating) {
			roomCode = generateRoomCode();
			document.getElementById('input-room-code').value = roomCode;
		  } else if (!roomCode || roomCode.length < 3) {
			errorText.innerText = 'Enter a valid Room Code.';
			debugLog('Invalid room code provided:', roomCode);
			return;
		  }

		  roomCodeDisplay = roomCode;
		  if (currentRoomRef) {
			try { currentRoomRef.off(); } catch (e) { debugLog('Error turning off previous room listener', e); }
		  }

		  currentRoomRef = firebaseDb.ref('rooms/' + roomCode);
		  gameMode = 'ONLINE';

		  document.getElementById('modal-start-menu').classList.add('hidden');
		  document.getElementById('btn-close-menu').classList.remove('hidden');
		  updateUIStatus();

		  errorText.innerText = isCreating ? 'Creating room...' : 'Joining room...';

		  if (isCreating) {
			debugLog('Creating new room: ' + roomCode);
			localPlayerRole = 1;
			isHost = true;

			const initialPayload = {
			  players: { [localPlayerName]: 1 },
			  flatBoard: serializeBoard(),
			  currentTurn: 1,
			  gamePhase: 'PLACE',
			  placementCount: { 1: 0, 2: 0 },
			  selectedWorkerPos: { r: -1, c: -1 },
			  winner: 0,
			  lastWriter: localSessionId,
			  lastUpdated: firebase.database.ServerValue.TIMESTAMP
			};

			debugLog('Writing full initial payload to Firebase');
			await currentRoomRef.set(initialPayload);

			debugLog(`Created Room: ${roomCode} | Host: ${localPlayerName}`);
			errorText.innerText = 'Room created. Waiting for opponent...';
			resetGameLogic();
		  } else {
			debugLog('Attempting to join room: ' + roomCode);
			const snapshot = await currentRoomRef.once('value');
			const data = snapshot.val();
			debugLog('Room snapshot retrieved:', data);

			if (!data) {
			  alert('Room not found!');
			  errorText.innerText = 'Room not found.';
			  debugLog('Room does not exist');
			  return;
			}

			if (data.players && data.players[localPlayerName]) {
			  localPlayerRole = data.players[localPlayerName];
			  isHost = (localPlayerRole === 1);
			  debugLog(`Resuming Session | Name: ${localPlayerName} | Role: P${localPlayerRole}`);
			} else {
			  const existingRoles = data.players ? Object.values(data.players) : [];
			  if (!existingRoles.includes(1)) localPlayerRole = 1;
			  else if (!existingRoles.includes(2)) localPlayerRole = 2;
			  else {
				alert('Room is already full with 2 distinct names.');
				errorText.innerText = 'Room full.';
				debugLog('No available player slots');
				return;
			  }

				  debugLog('Assigning role P' + localPlayerRole + ' to new player ' + localPlayerName);
				  await currentRoomRef.child('players').update({ [localPlayerName]: localPlayerRole });
				  isHost = (localPlayerRole === 1);
				  debugLog(`Joined as P${localPlayerRole} | Name: ${localPlayerName}`);
				}

			if (data.flatBoard && data.flatBoard.length > 0) {
			  boardState = deserializeBoard(data.flatBoard);
			  currentTurn = data.currentTurn || 1;
			  gamePhase = data.gamePhase || 'PLACE';
			  placementCount = data.placementCount || { 1: 0, 2: 0 };
			  winner = data.winner || 0;
			  debugLog('Board state loaded from room');
			}

			updateUIStatus();
		  }

		  debugLog('Registering realtime listener for room: ' + roomCode);
		  currentRoomRef.on('value', snapshot => {
			try {
			  const data = snapshot.val();
			  if (!data) { debugLog('Listener: data null'); return; }
			  if (!data.flatBoard) { debugLog('Listener: flatBoard missing'); return; }
			  if (data.lastWriter === localSessionId) { debugLog('Listener: ignoring own write'); return; }

			  debugLog('Received update from opponent');

			  if (data.gamePhase === 'GAME_OVER' && gamePhase !== 'GAME_OVER') {
				winner = data.winner;
				gamePhase = 'GAME_OVER';
				confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
			  } else {
				gamePhase = data.gamePhase;
				winner = data.winner || 0;
			  }

			  boardState = deserializeBoard(data.flatBoard);
			  currentTurn = data.currentTurn;
			  placementCount = data.placementCount || { 1: 0, 2: 0 };

			  if (gamePhase === 'GAME_OVER' && isLocalTurn()) {
				resetGameLogic();
				return;
			  }

			  selectedWorkerPos = (data.selectedWorkerPos && data.selectedWorkerPos.r !== -1) ? data.selectedWorkerPos : null;
			  errorText.innerText = '';

			  render3DBoardFromState();
			  updateUIStatus();
			} catch (e) {
			  debugLog('Error in listener: ' + e);
			  console.error('Listener error', e);
			}
		  });

		} catch (err) {
		  console.error('setupOnlineRoom error', err);
		  debugLog('setupOnlineRoom error: ' + (err && err.message ? err.message : err));
		  document.getElementById('online-status').innerText = 'Error: ' + (err && err.message ? err.message : 'unknown');
		  try { document.getElementById('modal-start-menu').classList.remove('hidden'); } catch(e){}
		}
	  }

	  // Button Listeners
	  document.getElementById('btn-local-play').addEventListener('click', () => {
		const nameInput = document.getElementById('input-player-name').value.trim();
		if (!nameInput) {
		  document.getElementById('online-status').innerText = 'Please enter your name first.';
		  return;
		}
		localPlayerName = nameInput;
		setCookie('santorini_playerName', nameInput);

		if (currentRoomRef) currentRoomRef.off();
		currentRoomRef = null;
		gameMode = 'LOCAL';
		document.getElementById('modal-start-menu').classList.add('hidden');
		document.getElementById('btn-close-menu').classList.remove('hidden');
		debugLog('Started Local Pass & Play');
		resetGameLogic();
	  });

	  document.getElementById('btn-create-room').addEventListener('click', () => {
		const nameInput = document.getElementById('input-player-name').value.trim();
		if (!nameInput) {
		  document.getElementById('online-status').innerText = 'Please enter your name first.';
		  return;
		}
		localPlayerName = nameInput;
		setCookie('santorini_playerName', nameInput);
		setupOnlineRoom(true);
	  });

	  document.getElementById('btn-join-room').addEventListener('click', () => {
		const nameInput = document.getElementById('input-player-name').value.trim();
		const roomCode = document.getElementById('input-room-code').value.trim().toUpperCase();
		if (!nameInput) {
		  document.getElementById('online-status').innerText = 'Please enter your name first.';
		  return;
		}
		localPlayerName = nameInput;
		setCookie('santorini_playerName', nameInput);
		if (roomCode) setCookie('santorini_roomCode', roomCode);
		setupOnlineRoom(false);
	  });

	  document.getElementById('btn-close-menu').addEventListener('click', () => {
		if (currentRoomRef) currentRoomRef.off();
		document.getElementById('modal-start-menu').classList.remove('hidden');
		document.getElementById('btn-close-menu').classList.add('hidden');
	  });

	  // Initialize the game
	  debugLog('Initializing game board and 3D scene');

	  // Load saved player name and room code from cookies
	  loadFromCookies();

	  // Check for room code in URL query parameters
	  const urlParams = new URLSearchParams(window.location.search);
	  const roomFromUrl = urlParams.get('room');
	  const opponentFromUrl = urlParams.get('opponent');
	  if (roomFromUrl) {
		debugLog('Room code detected in URL: ' + roomFromUrl);
		document.getElementById('input-room-code').value = roomFromUrl;
	  }
	  if (opponentFromUrl) {
		debugLog('Opponent name detected in URL: ' + opponentFromUrl);
		// Add helpful text showing who invited them
		const statusEl = document.getElementById('online-status');
		statusEl.innerText = 'Joining ' + decodeURIComponent(opponentFromUrl) + '\'s game...';
		statusEl.classList.remove('text-red-500');
		statusEl.classList.add('text-blue-600');
	  }

	  initBoardState();
	  init3D();
	  render3DBoardFromState();
	  debugLog('Game ready!');
	</script>
